<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .title { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 72px; text-anchor: middle; letter-spacing: 6px; }
    .r { fill: #ff2d4d; animation: gr 6s infinite steps(1); }
    .c { fill: #19e3ff; animation: gc 6s infinite steps(1); }
    .w { fill: #f2f5f8; }
    @keyframes gr { 0%,88%,100% { transform: translate(-3px,0); } 90% { transform: translate(7px,-3px); } 92% { transform: translate(-9px,2px); } 94% { transform: translate(5px,1px); } 96% { transform: translate(-2px,0); } }
    @keyframes gc { 0%,88%,100% { transform: translate(3px,0); } 90% { transform: translate(-7px,2px); } 92% { transform: translate(9px,-2px); } 94% { transform: translate(-5px,0); } 96% { transform: translate(2px,0); } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(350px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bar { fill: #ff2d4d; transform-box: fill-box; transform-origin: left center; animation: bar 6s infinite; }
    @keyframes bar { 0% { transform: scaleX(0); } 66% { transform: scaleX(1); } 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .enc { opacity: 0; }
    .e1 { animation: k1 6s infinite; } .e2 { animation: k2 6s infinite; } .e3 { animation: k3 6s infinite; } .e4 { animation: k4 6s infinite; } .e5 { animation: k5 6s infinite; }
    @keyframes k1 { 0%,12% { opacity: 0; } 14%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes k2 { 0%,25% { opacity: 0; } 27%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes k3 { 0%,38% { opacity: 0; } 40%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes k4 { 0%,51% { opacity: 0; } 53%,92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes k5 { 0%,64% { opacity: 0; } 66%,92% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16202b" stroke-width="1"/>
    </pattern>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d4d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2d4d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff2d4d" stop-opacity="0"/>
    </linearGradient>
    <g id="file">
      <path d="M0 0H42L60 18V76H0Z" fill="#1b2733" stroke="#3a4b5c" stroke-width="2"/>
      <path d="M42 0V18H60" fill="#2a3a4a" stroke="#3a4b5c" stroke-width="2"/>
      <line x1="10" y1="30" x2="40" y2="30" stroke="#3a4b5c" stroke-width="3"/>
      <line x1="10" y1="40" x2="48" y2="40" stroke="#3a4b5c" stroke-width="3"/>
    </g>
    <g id="lockov">
      <path d="M0 0H42L60 18V76H0Z" fill="#5a1020" fill-opacity="0.85" stroke="#ff2d4d" stroke-width="2"/>
      <rect x="19" y="46" width="22" height="17" rx="2" fill="#ff2d4d"/>
      <path d="M23 46V41a7 7 0 0 1 14 0V46" fill="none" stroke="#ff2d4d" stroke-width="3"/>
      <circle cx="30" cy="54" r="2.5" fill="#0b0f14"/>
    </g>
  </defs>

  <rect width="800" height="330" fill="#0b0f14"/>
  <rect width="800" height="330" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="800" height="20" fill="url(#sg)"/>

  <!-- glitch title -->
  <text class="title r" x="400" y="78">REvil</text>
  <text class="title c" x="400" y="78">REvil</text>
  <text class="title w" x="400" y="78">REvil</text>

  <text class="mono" x="400" y="110" text-anchor="middle" font-size="18" fill="#ff2d4d" letter-spacing="4" font-weight="700">GOLD SOUTHFIELD</text>
  <text class="mono" x="400" y="134" text-anchor="middle" font-size="13" fill="#8a9bad" letter-spacing="2">CyberDefenders  //  Blue Team Lab  //  Threat Hunting  //  Easy</text>

  <!-- files -->
  <g transform="translate(100,156)"><use href="#file"/><g class="enc e1"><use href="#lockov"/></g></g>
  <g transform="translate(230,156)"><use href="#file"/><g class="enc e2"><use href="#lockov"/></g></g>
  <g transform="translate(360,156)"><use href="#file"/><g class="enc e3"><use href="#lockov"/></g></g>
  <g transform="translate(490,156)"><use href="#file"/><g class="enc e4"><use href="#lockov"/></g></g>
  <g transform="translate(620,156)"><use href="#file"/><g class="enc e5"><use href="#lockov"/></g></g>

  <!-- progress bar -->
  <rect x="100" y="254" width="580" height="8" fill="#16202b" stroke="#3a4b5c"/>
  <rect class="bar" x="100" y="254" width="580" height="8"/>

  <!-- terminal + tools -->
  <text class="mono" x="100" y="298" font-size="14" fill="#19e3ff">&gt; hunting in Splunk (Sysmon logs)<tspan class="cursor" fill="#f2f5f8"> _</tspan></text>
  <text class="mono" x="680" y="298" font-size="12" fill="#8a9bad" text-anchor="end">Splunk · ELK · OSINT</text>
</svg>
